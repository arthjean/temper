[package]
name = "temper"
version = "0.0.1"
edition = "2024"
description = "Experimental measured optimization for Rust binaries"
publish = false

[[bin]]
name = "cargo-temper"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.6.4", features = ["derive"] }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
